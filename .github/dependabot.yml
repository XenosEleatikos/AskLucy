version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    # AskLucy is a library: keep the version constraints wide instead of pinning to the latest release.
    versioning-strategy: widen
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
